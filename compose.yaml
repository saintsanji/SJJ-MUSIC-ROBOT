services:
  music-bot:
    build:
      context: .
      args:
        INCLUDE_NODELINK: ${INCLUDE_NODELINK:-true}
        NODELINK_REPOSITORY: ${NODELINK_REPOSITORY:-PerformanC/NodeLink}
        NODELINK_REF: ${NODELINK_REF:-main}
    container_name: ssj-music-robot
    init: true
    restart: unless-stopped
    env_file:
      - .env